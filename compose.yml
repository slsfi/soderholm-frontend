services:
  nginx:
    image: docker.io/library/nginx:1.30.2
    depends_on:
      - web
    ports:
      - 2092:80
    restart: unless-stopped
    volumes:
      - browser-static:/static
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/slsfi/soderholm-frontend:1.8.6-production.1
    restart: unless-stopped
    volumes:
      - browser-static:/digital-edition-frontend-ng/dist/app/browser
volumes:
  browser-static:
